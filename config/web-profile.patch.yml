# 会话搜索改用持久索引：默认 :memory: 每次重启都要重建全部历史 /
# Persistent session-search index: the default :memory: rebuilds the whole history
# on every restart. openAt: first-search keeps the node:sqlite import lazy.
- id: optional-session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: /Users/wanglu/.dsh/session-search.db
    openAt: first-search
# LSP servers for the web profile — replaces the rust-only table.
#
# Default `servers` is empty by design, so every language has to be declared
# explicitly. Each entry pins the absolute binary path: the profile's PATH is
# the launching shell's PATH, and `dsh web` may be started from anywhere.
#
# `projectMarkers` is what routes a file whose extension is claimed by more
# than one entry: the nearest ancestor marker wins, so a nested project can
# use a different server than its parent.
- id: lsp-actions
  name: dsh-lsp-actions
  config:
    servers:
      # ── Rust ────────────────────────────────────────────────────────────
      rust:
        command: /Users/wanglu/.cargo/bin/rust-analyzer
        extensionToLanguage:
          .rs: rust
        projectMarkers: [ "Cargo.toml" ]
        initializationOptions:
          checkOnSave: false
          cargo:
            allFeatures: false

      # ── TypeScript / JavaScript ─────────────────────────────────────────
      # One server covers .ts/.tsx/.js/.jsx/.mjs/.cjs; it resolves the
      # workspace's own typescript package through its `tsdk` init option.
      typescript:
        command: /Users/wanglu/.local/share/dsh-lsp/.bin/typescript-language-server
        args: [ "--stdio" ]
        extensionToLanguage:
          .ts: typescript
          .tsx: typescriptreact
          .js: javascript
          .jsx: javascriptreact
          .mjs: javascript
          .cjs: javascript
        projectMarkers: [ "tsconfig.json", "jsconfig.json", "package.json" ]
        initializationOptions:
          hostInfo: "dsh-edit-verify"
          # 显式指定 tsserver：否则 servers 会在**当前工作区**找 node_modules/typescript，
          # 在 Rust/Go 等非前端仓库里必然失败（实测报 "Could not find a valid TypeScript installation"）。
          # Pin tsserver explicitly: otherwise the server looks for node_modules/typescript
          # in the WORKSPACE, which fails in any non-frontend repository.
          tsserver:
            path: /Users/wanglu/.local/share/dsh-lsp/typescript/lib/tsserver.js
          preferences:
            includeInlayParameterNameHints: "none"

      # ── Python ──────────────────────────────────────────────────────────
      # pyright requires an explicit transport; it reads pyproject.toml,
      # pyrightconfig.json, and setup.py for its project layout.
      python:
        command: /Users/wanglu/.local/share/dsh-lsp/.bin/pyright-langserver
        args: [ "--stdio" ]
        extensionToLanguage:
          .py: python
          .pyi: python
        projectMarkers: [ "pyproject.toml", "pyrightconfig.json", "setup.py", "requirements.txt" ]

      # ── Go ──────────────────────────────────────────────────────────────
      go:
        command: /Users/wanglu/go/bin/gopls
        extensionToLanguage:
          .go: go
        projectMarkers: [ "go.mod", "go.work" ]

      # ── C / C++ ─────────────────────────────────────────────────────────
      # clangd discovers compile_commands.json or compile_flags.txt itself;
      # without either it still reports syntax errors from its own parse.
      c:
        command: /usr/bin/clangd
        extensionToLanguage:
          .c: c
          .h: c
          .cc: cpp
          .cpp: cpp
          .cxx: cpp
          .hpp: cpp
          .hh: cpp
        projectMarkers: [ "compile_commands.json", "compile_flags.txt", "CMakeLists.txt" ]

    # Keep the editor half off in the Web profile: the stdio editor backend is
    # owned by dedicated integrations, and leaving it enabled here would open a
    # second server per language.
    editor:
      enabled: false
      requestTimeoutMs: 60000
      diagnosticsCacheMaxFiles: 128
    maxDiagnostics: 200
    maxCompletionItems: 20
    maxCodeActions: 50
    maxSymbols: 100
    maxSignatures: 10
    maxInlayHints: 200
    maxResultChars: 16000
    timeoutMs: 60000
- id: auto-continue
  name: dsh-client-auto-continue
  config:
    sessionModes:
      session-9f20abbc-a6e2-42f0-99cf-ba58298575ea: default
