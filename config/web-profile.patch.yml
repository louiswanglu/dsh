              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # 压缩触发与保留策略 / Condensation trigger and retention.
                  # retainRatio 从默认 0.16 提到 0.30：近期原文保留翻倍。窗口 1M 时约 30 万 token
                  # 原文，"刚说过就忘" 主要来自这个值太小。
                  # Raised from the 0.16 default: at a 1M window this keeps ~300k tokens of verbatim
                  # recent history, which is the "it forgot what I just said" feeling.
                  retainRatio: 0.30
                  # 摘要交给强模型写，而不是跟随主模型的 flash。摘要质量直接决定压缩后还剩多少信息。
